<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>EFALP Nurseries · Plant Management</title>
<link rel="icon" href="logo.png">
<style>
:root{
  --g900:#0f4d2a;--g800:#146b3a;--g700:#1b7a3e;--g600:#2e9d4a;--g400:#8dc63f;--g100:#e8f4e4;--g50:#f4f8f2;
  --ink:#1d2b22;--ink2:#4b5a50;--ink3:#7d8a81;--line:#dfe7dc;--card:#fff;
  --warn:#b26a00;--warnbg:#fff4e0;--bad:#b42318;--badbg:#fdecea;--ok:#1b7a3e;--okbg:#e6f4ea;--info:#1f5fa8;--infobg:#e8f0fb;
  --r:10px;--shadow:0 1px 2px rgba(16,40,24,.06),0 2px 8px rgba(16,40,24,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--g50)}
a{color:var(--g700)}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
/* layout */
#app{display:flex;min-height:100vh}
#side{width:232px;flex:none;background:var(--g800);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
#side .brand{background:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:4px solid var(--g400)}
#side .brand img{width:52px;height:52px;object-fit:contain}
#side .brand b{display:block;color:var(--g800);font-size:15px;letter-spacing:.3px}
#side .brand span{color:var(--ink3);font-size:11.5px}
#side nav{padding:10px 8px;flex:1;overflow:auto}
#side nav a{display:flex;align-items:center;gap:10px;color:#dcefe0;text-decoration:none;padding:9px 12px;border-radius:8px;margin:1px 0;font-weight:500}
#side nav a:hover{background:rgba(255,255,255,.08);color:#fff}
#side nav a.on{background:#fff;color:var(--g800)}
#side nav .sep{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#9fcaa9;padding:14px 12px 4px}
#side nav svg{width:18px;height:18px;flex:none}
#side .me{padding:12px 16px;border-top:1px solid rgba(255,255,255,.12);font-size:12.5px}
#side .me b{display:block;font-size:13.5px}
#side .me button{margin-top:8px;background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:12px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
#top h1{font-size:18px;margin:0;font-weight:650;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menuBtn{display:none;border:0;background:none;padding:4px;cursor:pointer}
#live{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px;white-space:nowrap}
#live i{width:8px;height:8px;border-radius:50%;background:var(--g600);display:inline-block;box-shadow:0 0 0 3px #d6eedc}
#live.err i{background:var(--bad);box-shadow:0 0 0 3px #f6d5d2}
#view{padding:22px 24px 60px;max-width:1400px;width:100%}
/* components */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.card h3{margin:0 0 12px;font-size:14.5px;font-weight:650}
.card h3 small{font-weight:400;color:var(--ink3);margin-left:6px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--ink2);font-weight:500}
.kpi .v{font-size:26px;font-weight:700;margin-top:2px;letter-spacing:-.3px;color:var(--g900)}
.kpi .s{font-size:12px;color:var(--ink3)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:550;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#c4d3c0;background:#fbfdfb}
.btn.pri{background:var(--g700);border-color:var(--g700);color:#fff}
.btn.pri:hover{background:var(--g800)}
.btn.danger{color:var(--bad);border-color:#f0c9c5}
.btn.danger:hover{background:var(--badbg)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar .grow{flex:1}
input.in,select.in,textarea.in{border:1px solid #cfdacb;border-radius:8px;padding:7px 10px;background:#fff;min-width:0;width:100%}
input.in:focus,select.in:focus,textarea.in:focus{outline:2px solid #bfe3c8;border-color:var(--g600)}
.search{position:relative;flex:1;min-width:220px}
.search input{padding-left:34px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink3)}
.bar select.in{width:auto;max-width:200px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--g100);color:var(--g800);white-space:nowrap}
.pill.loc-DHAD{background:#e9f0fb;color:#1f4f8a}
.h-Excellent,.h-Good{background:var(--okbg);color:var(--ok)}
.h-Fair{background:var(--infobg);color:var(--info)}
.h-Weak{background:var(--warnbg);color:var(--warn)}
.h-Diseased,.h-Dead{background:var(--badbg);color:var(--bad)}
table.t{width:100%;border-collapse:collapse;background:#fff}
table.t th,table.t td{text-align:left;padding:8px 10px;border-bottom:1px solid #edf1eb;vertical-align:middle}
table.t th{font-size:12px;color:var(--ink2);font-weight:600;background:#f8faf7;position:sticky;top:0;cursor:pointer;user-select:none;white-space:nowrap}
table.t tbody tr:hover{background:#f6faf5;cursor:pointer}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{border:1px solid var(--line);border-radius:var(--r);overflow:auto;box-shadow:var(--shadow);background:#fff}
.thumb{width:38px;height:38px;border-radius:6px;object-fit:cover;background:var(--g100);display:block}
.thumb.ph{display:flex;align-items:center;justify-content:center;color:#a8c3ad}
.muted{color:var(--ink3)}.small{font-size:12.5px}
.mono{font-family:Consolas,"SF Mono",Menlo,monospace;font-size:12.5px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;color:var(--ink2);font-size:13px}
/* charts */
.hbar{display:grid;grid-template-columns:minmax(90px,170px) 1fr auto;gap:6px 10px;align-items:center;font-size:13px}
.hbar .lab{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .trk{height:14px;position:relative}
.hbar .fill{height:14px;background:var(--g600);border-radius:0 4px 4px 0;min-width:2px}
.hbar .fill:hover{background:var(--g800)}
.hbar .val{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;text-align:right}
.vbars{display:flex;align-items:flex-end;gap:4px;height:170px;padding-top:8px;border-bottom:1px solid var(--line)}
.vbars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.vbars .col .f{width:100%;max-width:34px;background:var(--g600);border-radius:4px 4px 0 0;min-height:2px}
.vbars .col:hover .f{background:var(--g800)}
.vbars .col span{font-size:11px;color:var(--ink);font-weight:600;margin-bottom:2px}
.vlabels{display:flex;gap:4px;margin-top:4px}
.vlabels span{flex:1;font-size:10.5px;color:var(--ink3);text-align:center;min-width:0;overflow:hidden;white-space:nowrap}
/* plant detail */
.dhead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
.dhead h2{margin:0;font-size:22px}
.dhead .sub{color:var(--ink2);margin-top:2px}
.dl{display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:6px 14px;font-size:13.5px}
.dl dt{color:var(--ink3)}
.dl dd{margin:0;word-break:break-word}
.qrbox{text-align:center}
.qrbox .q{width:200px;height:200px;margin:0 auto;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qrbox .q svg{width:100%;height:100%;display:block}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.sizes div{border:1px solid var(--line);border-radius:8px;padding:6px 10px;text-align:center;min-width:82px;background:#fbfdfb}
.sizes b{display:block;font-size:17px;color:var(--g900)}
.sizes span{font-size:11.5px;color:var(--ink3)}
.rep{border-top:1px solid var(--line);padding:14px 0}
.rep:first-child{border-top:0;padding-top:0}
.rep .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.rep p{margin:6px 0 8px;white-space:pre-wrap}
.photos{display:flex;flex-wrap:wrap;gap:8px}
.photos img{width:110px;height:110px;object-fit:cover;border-radius:8px;cursor:zoom-in;background:var(--g100);border:1px solid var(--line)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.pgrid .pc{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;box-shadow:var(--shadow)}
.pgrid .pc img{width:100%;height:140px;object-fit:cover;display:block;background:var(--g100)}
.pgrid .pc div{padding:8px 10px;font-size:12.5px}
/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px 16px}
.form label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.form .full{grid-column:1/-1}
.req{color:var(--bad)}
.fgroup{margin-bottom:18px}
.fgroup h4{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--g700)}
.sizegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.sizegrid label{font-size:11.5px}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,30,18,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto}
.modal{background:#fff;border-radius:12px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{max-width:900px}
.modal header{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal header h3{margin:0;flex:1;font-size:16px}
.modal .body{padding:16px 18px}
.modal footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--ink3);line-height:1}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:60;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:20px}
#lightbox img{max-width:100%;max-height:85vh;border-radius:6px}
#lightbox a{color:#fff;font-size:13px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center}
#toast div{background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:13.5px;max-width:90vw}
#toast div.err{background:var(--bad)}
.notice{padding:10px 14px;border-radius:8px;background:var(--warnbg);color:#6b4100;border:1px solid #f3dcae;margin-bottom:14px;font-size:13.5px}
.empty{padding:40px;text-align:center;color:var(--ink3)}
/* splash */
#splash{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--g800),var(--g900));padding:20px}
#splash .box{background:#fff;border-radius:16px;padding:32px 34px;max-width:440px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#splash img{width:130px}
#splash h2{margin:14px 0 4px;color:var(--g800)}
#splash p{color:var(--ink2);margin:6px 0 18px}
.spin{width:28px;height:28px;border:3px solid var(--g100);border-top-color:var(--g600);border-radius:50%;animation:sp 0.8s linear infinite;margin:10px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.ms{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer}
/* labels print */
.labels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.label{border:1px dashed #9db5a3;border-radius:8px;padding:10px;display:flex;gap:10px;align-items:center;page-break-inside:avoid;background:#fff}
.label .q{width:110px;height:110px;flex:none}
.label .q svg{width:100%;height:100%}
.label b{display:block;font-size:12.5px;white-space:nowrap}
.label .lg{width:30px;display:block;margin-bottom:4px}
.label div{font-size:11px;line-height:1.35;min-width:0}
@media (max-width:900px){
  #side{position:fixed;left:-250px;z-index:40;transition:left .2s;box-shadow:0 0 40px rgba(0,0,0,.3)}
  #side.open{left:0}
  #menuBtn{display:block}
  #view{padding:14px 12px 60px}
  #top{padding:10px 12px}
  .g2,.g3{grid-template-columns:1fr}
  .labels{grid-template-columns:repeat(2,1fr)}
  .hide-m{display:none}
  .dl{grid-template-columns:120px 1fr}
}
@media print{
  #side,#top,.noprint,#toast{display:none!important}
  body{background:#fff}
  #view{padding:0;max-width:none}
  .card,.tablewrap,.kpi{box-shadow:none}
  .labels{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>
<div id="splash"><div class="box">
  <img src="logo.png" alt="EFALP Nurseries">
  <h2>EFALP Nurseries</h2>
  <div class="muted">Plant Stock &amp; QR Management</div>
  <div id="splashMsg"><div class="spin"></div><p>Loading…</p></div>
</div></div>

<div id="app" class="hidden">
  <aside id="side">
    <div class="brand"><img src="logo.png" alt=""><div><b id="coName">EFALP Nurseries</b><span>Plant Management</span></div></div>
    <nav id="nav"></nav>
    <div class="me"><b id="meName"></b><span id="meRole"></span><br><button onclick="signOut()">Sign out</button></div>
  </aside>
  <div id="main">
    <div id="top">
      <button id="menuBtn" onclick="document.getElementById('side').classList.toggle('open')" aria-label="Menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <h1 id="title">Dashboard</h1>
      <div id="live" title="Changes by other users appear automatically"><i></i><span>Connecting…</span></div>
    </div>
    <div id="view"></div>
  </div>
</div>
<div id="modalRoot"></div>
<div id="toast"></div>

<script src="config.js"></script>
<script src="qrcode.js"></script>
<script>
"use strict";
/* =====================================================================
   EFALP Nurseries · Plant Management
   Database = Supabase (Postgres + Auth + Storage), plain REST calls
   ===================================================================== */
const CFG = Object.assign({refreshSeconds: 5}, window.EFALP_CONFIG || {});
const FIXED = {barcode: "Barcode", location: "Location", total: "Total Qty", by: "Updated By", at: "Updated At"};
const ROLES = {superadmin: "Super Admin", manager: "Manager", engineer: "Engineer"};
const CAN = {
  superadmin: {edit: 1, del: 1, report: 1, delReport: 1, fields: 1, users: 1, settings: 1, activity: 1},
  manager:    {edit: 1, del: 1, report: 1, delReport: 1, activity: 1},
  engineer:   {edit: 1, report: 1}
};
const S = {me: null, role: null, tables: {}, fields: [], settings: {}, locations: [], bands: [], health: [],
  photos: {}, ids: {}, view: {}, lastSync: null, sig: {}, editing: false, tick: 0};

/* ---------------- small helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const num = v => { const n = parseFloat(String(v).replace(/,/g, "")); return isFinite(n) ? n : 0; };
const fmt = n => Math.round(n).toLocaleString("en-US");
const fmtAED = n => "AED " + Number(n).toLocaleString("en-US", {maximumFractionDigits: 0});
const today = () => new Date().toISOString().slice(0, 10);
const nowStr = () => { const d = new Date(), p = x => String(x).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const can = k => !!(CAN[S.role] || {})[k];
const sleep = ms => new Promise(r => setTimeout(r, ms));
function toast(msg, err) { const d = document.createElement("div"); if (err) d.className = "err"; d.textContent = msg; $("#toast").appendChild(d); setTimeout(() => d.remove(), err ? 7000 : 3500); }
function excelDate(v) {
  if (typeof v === "number" && v > 20000 && v < 80000) return new Date(Math.round((v - 25569) * 86400000)).toISOString().slice(0, 10);
  return v == null ? "" : String(v);
}
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function ssGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
function ssSet(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} }
const ICON = {
  dash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>',
  plant: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22V10"/><path d="M12 10C12 6 9 3 4 3c0 5 3 7 8 7z"/><path d="M12 13c0-4 3-7 8-7 0 5-3 7-8 7z"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  cam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>',
  qr: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>',
  cols: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/></svg>',
  users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  log: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg>',

const SB = String(CFG.supabaseUrl || "").trim().replace(/\/+$/, ""), KEY = String(CFG.supabaseKey || "").trim();
const REDIRECT = location.origin + location.pathname;
let SESSION = null; try { SESSION = JSON.parse(lsGet("efalp_sb")); } catch (e) {}
function saveSession(j) {
  SESSION = j ? {access: j.access_token, refresh: j.refresh_token, exp: Date.now() + ((+j.expires_in || 3600) - 60) * 1000,
    user: j.user ? {id: j.user.id, email: j.user.email} : (SESSION && SESSION.user) || null} : null;
  lsSet("efalp_sb", SESSION ? JSON.stringify(SESSION) : null);
  return SESSION;
}
function authMsg(m) {
  m = String(m || "");
  if (/invalid login|invalid_credentials/i.test(m)) return "Wrong email or password.";
  if (/not confirmed/i.test(m)) return "Please confirm your email first: open the confirmation link we emailed you.";
  if (/already registered|already exists/i.test(m)) return "This email already has an account. Use Sign in or Forgot password.";
  if (/rate limit/i.test(m)) return "Too many attempts. Please wait a minute and try again.";
  return m;
}
async function authCall(path, body, method = "POST", token) {
  const headers = {apikey: KEY, "Content-Type": "application/json"}; if (token) headers.Authorization = "Bearer " + token;
  const r = await fetch(SB + "/auth/v1/" + path, {method, headers, body: method === "GET" ? undefined : JSON.stringify(body || {})});
  const t = await r.text(); let j = {}; try { j = t ? JSON.parse(t) : {}; } catch (e) {}
  if (!r.ok) throw new Error(authMsg(j.error_description || j.msg || j.message || j.error_code || j.error || r.statusText));
  return j;
}
let refreshing = null;
async function getToken() {
  if (!SESSION || !SESSION.access) throw new Error("NOT_SIGNED_IN");
  if (Date.now() < SESSION.exp) return SESSION.access;
  if (!refreshing) refreshing = authCall("token?grant_type=refresh_token", {refresh_token: SESSION.refresh}).then(saveSession).finally(() => refreshing = null);
  try { await refreshing; return SESSION.access; } catch (e) { saveSession(null); throw new Error("NOT_SIGNED_IN"); }
}
function friendlyErr(m) {
  m = String(m || "");
  if (/row-level security|permission denied|42501/i.test(m)) return "You don't have permission to do this.";
  if (/duplicate key|already exists/i.test(m)) return "This record already exists.";
  if (/JWT expired/i.test(m)) return "Session expired, please sign in again.";
  if (/Failed to fetch|NetworkError/i.test(m)) return "No internet connection. Please try again.";
  return m;
}
async function api(path, opt = {}, retried) {
  const token = await getToken();
  const headers = Object.assign({apikey: KEY, Authorization: "Bearer " + token}, opt.headers || {});
  let body = opt.body;
  if (body !== undefined && !(body instanceof Blob) && typeof body !== "string") { body = JSON.stringify(body); headers["Content-Type"] = "application/json"; }
  let r;
  try { r = await fetch(SB + path, {method: opt.method || "GET", headers, body}); }
  catch (e) { throw new Error(friendlyErr(e.message)); }
  if (r.status === 401 && !retried) { SESSION.exp = 0; return api(path, opt, true); }
  const t = await r.text(); let j = null; try { j = t ? JSON.parse(t) : null; } catch (e) { j = t; }
  if (!r.ok) { const e = new Error(friendlyErr((j && (j.message || j.error_description || j.msg || j.error)) || r.statusText)); e.status = r.status; throw e; }
  return j;
}

const rest = (q, opt) => api("/rest/v1/" + q, opt);

async function selectAll(table, q) {

    out = out.concat(rows || []); if (!rows || rows.length < page) break; from += page;
  }
  return out;
}

function fmtTs(v) { if (!v) return ""; const d = new Date(v); if (isNaN(d)) return String(v); const p = x => String(x).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function plantFromRow(r) {

/* ---- photos (private bucket "photos", shown with signed links) ---- */
const thumbPath = p => p.replace(/\.jpg$/i, "_t.jpg");
const objPath = p => p.split("/").map(enc).join("/");
S.urls = {};
async function signPaths(paths) {
  const need = [...new Set(paths)].filter(p => p && (!S.urls[p] || S.urls[p].exp < Date.now()));
  for (let i = 0; i < need.length; i += 100) {
    const res = await api("/storage/v1/object/sign/photos", {method: "POST", body: {expiresIn: 21600, paths: need.slice(i, i + 100)}});
    (res || []).forEach(x => { const u = x.signedURL || x.signedUrl; if (u && !x.error) S.urls[x.path] = {u: /^https?:/.test(u) ? u : SB + "/storage/v1" + u, exp: Date.now() + 6 * 3600e3 - 120e3}; });
  }
}
async function hydratePhotos(root) {
  const imgs = [...(root || document).querySelectorAll("img[data-ph]")];
  if (!imgs.length) return;
  const want = imgs.map(i => i.dataset.size === "large" ? i.dataset.ph : thumbPath(i.dataset.ph));
  try { await signPaths(want); } catch (e) { console.warn(e); return; }
  imgs.forEach((img, k) => {
    img.onerror = () => { if (img.dataset.fb) return; img.dataset.fb = 1; signPaths([img.dataset.ph]).then(() => { const s = S.urls[img.dataset.ph]; if (s) img.src = s.u; }).catch(() => {}); };
    const s = S.urls[want[k]] || S.urls[img.dataset.ph];
    if (s && img.getAttribute("src") !== s.u) img.src = s.u; else if (!s) img.onerror();
  });
}
function compressImage(file, max = 1600, q = 0.82) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      let {width: w, height: h} = img; const s = Math.min(1, max / Math.max(w, h)); w = Math.round(w * s); h = Math.round(h * s);
      const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); c.toBlob(b => b ? res(b) : rej(new Error("Could not read image")), "image/jpeg", q);
    };
    img.onerror = () => rej(new Error("Could not read image " + file.name));
    img.src = url;
  });
}
async function uploadPhoto(file, path) {
  const [full, thumb] = await Promise.all([compressImage(file, 1600, 0.82), compressImage(file, 400, 0.75)]);
  const up = (b, p) => api("/storage/v1/object/photos/" + objPath(p), {method: "POST", body: b, headers: {"Content-Type": "image/jpeg", "x-upsert": "true", "cache-control": "31536000"}});
  await up(full, path); await up(thumb, thumbPath(path));

}
async function deletePhotos(paths) {
  if (!paths.length) return;
  try { await api("/storage/v1/object/photos", {method: "DELETE", body: {prefixes: paths.concat(paths.map(thumbPath))}}); } catch (e) { console.warn("photo delete failed", e); }
}

/* links from Supabase emails come back as #access_token=…&type=signup|recovery */
async function handleAuthHash() {

  const p = new URLSearchParams(h); history.replaceState(null, "", location.pathname + location.search);
  if (p.get("error_description")) { showSignIn(p.get("error_description").replace(/\+/g, " "), true); return "error"; }
  saveSession({access_token: p.get("access_token"), refresh_token: p.get("refresh_token"), expires_in: p.get("expires_in")});
  if (p.get("type") === "recovery") { showNewPassword(); return "recovery"; }

}

    await getToken();

function latestReports() { const m = {}; reports().forEach(r => { const k = r.Barcode; if (!m[k] || (r.Date + r["Created At"]) > (m[k].Date + m[k]["Created At"])) m[k] = r; }); return m; }
function hbars(entries, opts = {}) {
  const max = Math.max(1, ...entries.map(e => e[1]));

}
function groupSum(list, key, val) { const m = {}; list.forEach(p => { const k = String(p[key] || "—").trim() || "—"; m[k] = (m[k] || 0) + val(p); }); return Object.entries(m).sort((a, b) => b[1] - a[1]); }
function importCard() {
  return `<div class="card" style="margin-bottom:16px;border-color:#bfe3c8;background:#f3fbf5"><h3>Import your stock data</h3>

async function importData(file) {
  if (!file) return;
  const msg = t => { const m = $("#impMsg"); if (m) m.textContent = t; };
  try {
    let j; try { j = JSON.parse(await file.text()); } catch (e) { throw new Error("This file can't be read. Choose EFALP_starting_data.json."); }
    if (!j || !j.efalp_import || !Array.isArray(j.plants)) throw new Error("This is not an EFALP data file. Choose EFALP_starting_data.json.");
    const ign = {Prefer: "resolution=ignore-duplicates,return=minimal"};
    msg("Loading fields and settings…");
    if (j.fields && j.fields.length) await rest("fields?on_conflict=col", {method: "POST", body: j.fields, headers: ign});
    if (j.settings && j.settings.length) await rest("settings?on_conflict=key", {method: "POST", body: j.settings, headers: ign});
    for (let i = 0; i < j.plants.length; i += 100) {
      msg(`Loading plants ${i + 1}–${Math.min(i + 100, j.plants.length)} of ${j.plants.length}…`);
      await rest("plants?on_conflict=barcode", {method: "POST", body: j.plants.slice(i, i + 100), headers: ign});
    }
    await logActivity("Imported", "Database", `${j.plants.length} stock lines from ${file.name}`);
    toast(`Imported ${j.plants.length} stock lines`); await loadAll(true); render();
  } catch (e) { msg(""); toast("Import failed: " + e.message, true); }
}

function qparams() { const i = location.hash.indexOf("?"); return new URLSearchParams(i >= 0 ? location.hash.slice(i + 1) : ""); }
function listFields() { return S.fields.filter(f => f.active && f.exists && f.list); }
function filterPlants(st) {
  const q = (st.q || "").trim().toLowerCase().split(/\s+/).filter(Boolean);
  const latest = latestReports(), withPhoto = new Set(reports().filter(r => r._photos.length).map(r => r.Barcode));
  const priceCol = (S.fields.find(f => /price/i.test(f.col)) || {}).col;
  let list = plants().filter(p => {
    if (st.loc && p[FIXED.location] !== st.loc) return false;
    for (const [col, val] of Object.entries(st.f || {})) if (val && String(p[col]).trim() !== val) return false;
    if (st.flag === "noprice" && priceCol && num(p[priceCol]) > 0) return false;
    if (st.flag === "nophoto" && withPhoto.has(p[FIXED.barcode])) return false;
    if (st.flag === "photo" && !withPhoto.has(p[FIXED.barcode])) return false;
    if (st.flag && st.flag.startsWith("h:") && (!latest[p[FIXED.barcode]] || latest[p[FIXED.barcode]].Health !== st.flag.slice(2))) return false;
    if (q.length) { const hay = Object.keys(p).filter(k => k[0] !== "_").map(k => p[k]).join(" ").toLowerCase() + " " + locName(p[FIXED.location]).toLowerCase(); if (!q.every(w => hay.includes(w))) return false; }
    return true;
  });
  const s = st.sort || FIXED.barcode, dir = st.dir || 1;
  list.sort((a, b) => { const x = s === "_total" ? a._total : a[s], y = s === "_total" ? b._total : b[s];
    return (typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y), undefined, {numeric: true})) * dir; });
  return list;
}
function filterCols() { return S.fields.filter(f => f.active && f.exists && (f.type === "select" || /category|typology|site|origin/i.test(f.col))).slice(0, 4); }

    if (qp.toString()) history.replaceState(null, "", "#/plants");

  <div class="bar noprint">

    <select class="in" id="fFlag"><option value="">All records</option><option value="noprice" ${st.flag === "noprice" ? "selected" : ""}>Missing unit price</option><option value="photo" ${st.flag === "photo" ? "selected" : ""}>With photo report</option><option value="nophoto" ${st.flag === "nophoto" ? "selected" : ""}>Without photo report</option>${S.health.map(h => `<option value="h:${esc(h)}" ${st.flag === "h:" + h ? "selected" : ""}>Health: ${esc(h)}</option>`).join("")}</select>

      <tbody>${rows.map(p => { const b = p[FIXED.barcode], lr = latest[b]; return `<tr data-b="${esc(b)}"><td onclick="event.stopPropagation()"><input type="checkbox" data-selb="${esc(b)}" ${st.sel.has(b) ? "checked" : ""}></td>

      <div class="pager"><button class="btn sm" id="pPrev" ${st.page ? "" : "disabled"}>‹ Prev</button> Page ${st.page + 1} of ${pages} <button class="btn sm" id="pNext" ${st.page < pages - 1 ? "" : "disabled"}>Next ›</button></div>`
      : `<div class="card empty">No plants match your search.</div>`}`;

  draw();

function exportCSV(list) {
  const cols = S.tables.Plants.headers, label = c => (S.fields.find(f => f.col === c) || {}).label || c;
  const cell = v => { v = v == null ? "" : String(v); return /[",\n;]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };

function suggestBarcode(loc, name) {
  const all = plants().map(p => p[FIXED.barcode]);
  const nameCol = (S.fields.find(f => /common/i.test(f.col)) || {}).col;
  const same = plants().filter(p => String(p[nameCol]).trim().toLowerCase() === String(name).trim().toLowerCase() && name);
  let prefix = (same.find(p => p[FIXED.location] === loc) || same[0] || {})[FIXED.barcode];
  prefix = prefix ? prefix.split("-")[1] : (String(name).toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4) || "PLNT");
  const base = `${loc}-${prefix}-`;
  const n = Math.max(0, ...all.filter(c => c.startsWith(base)).map(c => parseInt(c.slice(base.length)) || 0)) + 1;
  return base + String(n).padStart(4, "0");
}
function inputFor(f, val) {
  const id = `f_${btoa(unescape(encodeURIComponent(f.col))).replace(/[^a-z0-9]/gi, "")}`;
  const lbl = `<label for="${id}">${esc(f.label)}${f.req ? ' <span class="req">*</span>' : ""}</label>`;
  const a = `id="${id}" data-col="${esc(f.col)}" class="in"`;
  if (f.type === "select") {
    const opts = f.options.slice(); if (val && !opts.includes(String(val))) opts.unshift(String(val));
    return `<div>${lbl}<select ${a}><option value=""></option>${opts.map(o => `<option ${String(val) === o ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></div>`;
  }
  if (f.type === "longtext") return `<div class="full">${lbl}<textarea ${a} rows="2">${esc(val)}</textarea></div>`;
  if (f.type === "number") return `<div>${lbl}<input ${a} type="number" step="any" value="${esc(val)}"></div>`;
  if (f.type === "date") return `<div>${lbl}<input ${a} type="date" value="${esc(/^\d{4}-\d{2}-\d{2}$/.test(val) ? val : "")}"></div>`;
  if (f.type === "url") return `<div>${lbl}<input ${a} type="url" value="${esc(val)}" placeholder="https://"></div>`;
  const uniq = [...new Set(plants().map(p => String(p[f.col]).trim()).filter(Boolean))].sort().slice(0, 300);
  return `<div>${lbl}<input ${a} list="${id}_dl" value="${esc(val)}" autocomplete="off"><datalist id="${id}_dl">${uniq.map(u => `<option value="${esc(u)}">`).join("")}</datalist></div>`;
}
async function savePlant(isNew, origBarcode, changes, orig) {
  const row = rowFromPlant(changes, orig && orig._data);
  if (isNew) { await rest("plants", {method: "POST", body: row, headers: RET}); return null; }
  let res = await rest(`plants?barcode=eq.${enc(origBarcode)}&updated_at=eq.${enc(orig._ts)}`, {method: "PATCH", body: row, headers: RET});
  if (!res || !res.length) {
    const cur = ((await rest(`plants?barcode=eq.${enc(origBarcode)}&select=updated_by,updated_at`)) || [])[0];
    if (!cur) throw new Error(`${origBarcode} no longer exists. It may have been deleted by another user.`);
    if (!confirm(`${origBarcode} was changed by ${cur.updated_by || "another user"} at ${fmtTs(cur.updated_at)} while you were editing.\n\nOK = overwrite with your changes\nCancel = keep their version`)) throw new Error("CANCELLED");
    res = await rest(`plants?barcode=eq.${enc(origBarcode)}`, {method: "PATCH", body: row, headers: RET});
  }
  return res;
}

    <div class="search">${ICON.search}<input class="in" id="rq" placeholder="Search barcode or notes…" value="${esc(st.q)}"></div>
    <select class="in" id="rl"><option value="">All locations</option>${S.locations.map(l => `<option value="${esc(l.code)}" ${st.loc === l.code ? "selected" : ""}>${esc(l.name)}</option>`).join("")}</select>
    <select class="in" id="rh"><option value="">All health</option>${S.health.map(h => `<option ${st.health === h ? "selected" : ""}>${esc(h)}</option>`).join("")}</select>
    <select class="in" id="rb"><option value="">Everyone</option>${byList.map(u => `<option ${st.by === u ? "selected" : ""}>${esc(u)}</option>`).join("")}</select>
    <input class="in" type="date" id="rf" value="${esc(st.from)}" style="width:auto" title="From"><input class="in" type="date" id="rt" value="${esc(st.to)}" style="width:auto" title="To">
    <button class="btn" onclick="window.print()">${ICON.print}Print</button></div><div id="rlist"></div>`;
  const draw = () => {
    const pmap = {}; plants().forEach(p => pmap[p[FIXED.barcode]] = p);
    const nameCol = (S.fields.find(f => /common/i.test(f.col)) || {}).col;
    const list = reports().filter(r => {
      const p = pmap[r.Barcode] || {};
      if (st.loc && (p[FIXED.location] || String(r.Barcode).split("-")[0]) !== st.loc) return false;
      if (st.health && r.Health !== st.health) return false;
      if (st.by && r["Created By"] !== st.by) return false;
      if (st.from && r.Date < st.from) return false;
      if (st.to && r.Date > st.to) return false;
      if (st.q && !(r.Barcode + " " + r.Note + " " + (p[nameCol] || "")).toLowerCase().includes(st.q.toLowerCase())) return false;
      return true;
    }).sort((a, b) => (String(b.Date) + b["Created At"]).localeCompare(String(a.Date) + a["Created At"]));
    $("#rlist").innerHTML = list.length ? `<div class="small muted" style="margin-bottom:8px">${list.length} reports</div>` + list.map(r => { const p = pmap[r.Barcode] || {}; return `<div class="card" style="margin-bottom:12px">
      <div class="rep"><div class="meta"><a href="#/plant/${encodeURIComponent(r.Barcode)}" class="mono"><b>${esc(r.Barcode)}</b></a><b>${esc(p[nameCol] || "")}</b><span class="pill h-${esc(r.Health)}">${esc(r.Health)}</span><span>${esc(r.Date)} · ${esc(r["Created By"])}</span>${p[FIXED.location] ? `<span class="pill loc-${esc(p[FIXED.location])}">${esc(locName(p[FIXED.location]))}</span>` : ""}</div>
      ${r.Note ? `<p>${esc(r.Note)}</p>` : ""}<div class="photos">${r._photos.map(id => `<img data-ph="${esc(id)}" onclick="lightbox('${esc(id)}')" alt="">`).join("")}</div></div></div>`; }).join("")
      : `<div class="card empty">No photo reports found.<br><span class="small">Open any plant in the Plant Master and press <b>Add photo report</b>.</span></div>`;
    hydratePhotos($("#rlist"));
  };
  const bind = (id, k, ev = "onchange") => $(id)[ev] = e => { st[k] = e.target.value; draw(); };
  bind("#rq", "q", "oninput"); bind("#rl", "loc"); bind("#rh", "health"); bind("#rb", "by"); bind("#rf", "from"); bind("#rt", "to");
  draw();
}

/* =====================================================================
   QR LABELS (print sheet)
   ===================================================================== */
function pLabels(v) {
  setTitle("QR Labels");
  const codes = S.labelList && S.labelList.length ? S.labelList : null;
  const list = codes ? plants().filter(p => codes.includes(p[FIXED.barcode])) : [];
  const nameCol = (S.fields.find(f => /common/i.test(f.col)) || {}).col, varCol = (S.fields.find(f => /variety/i.test(f.col)) || {}).col;
  v.innerHTML = `<div class="bar noprint">
    <div class="search">${ICON.search}<input class="in" id="lq" placeholder="Type barcodes or a plant name, e.g. Mango or ALRH-COCA"></div>
    <select class="in" id="lLoc"><option value="">All locations</option>${S.locations.map(l => `<option value="${esc(l.code)}">${esc(l.name)}</option>`).join("")}</select>
    <button class="btn" id="lFind">Select</button>
    <button class="btn pri" onclick="window.print()" ${list.length ? "" : "disabled"}>${ICON.print}Print ${list.length} labels</button>
    ${list.length ? `<button class="btn" id="lZip">${ICON.dl}Download PNGs</button>` : ""}
  </div>
  <p class="small muted noprint">${list.length ? `${list.length} labels ready. Tip: in the Plant Master, filter or tick plants and press <b>QR labels</b>.` : "Choose which plants to print: search above, or filter / tick plants in the Plant Master and press <b>QR labels</b>."}</p>
  <div class="labels">${list.slice(0, 600).map(p => `<div class="label"><div class="q">${qrSVG(qrText(p), {margin: 1})}</div><div><img class="lg" src="logo.png" alt=""><b class="mono">${esc(p[FIXED.barcode])}</b>${esc(p[nameCol] || "")}<br><span class="muted">${esc(p[varCol] || "")}</span><br>${esc(locName(p[FIXED.location]))}</div></div>`).join("")}</div>`;
  $("#lFind").onclick = () => { S.view.plants = null; S.labelList = filterPlants({q: $("#lq").value, loc: $("#lLoc").value, f: {}}).map(p => p[FIXED.barcode]); pLabels(v); };
  $("#lq").onkeydown = e => { if (e.key === "Enter") $("#lFind").click(); };
  if ($("#lZip")) $("#lZip").onclick = async () => { if (list.length > 30 && !confirm(`Download ${list.length} PNG files one by one?`)) return; for (const p of list) { await downloadQR(p[FIXED.barcode]); await sleep(350); } };
}

/* =====================================================================
   ADMIN · FIELDS & COLUMNS
   ===================================================================== */
const TYPES = {text: "Text", number: "Number", date: "Date", select: "Dropdown list", longtext: "Long text", url: "Link (URL)"};
function pFields(v) {
  if (!can("fields")) { v.innerHTML = `<div class="card empty">Super Admin only.</div>`; return; }
  setTitle("Fields & Columns");
  const fs = S.fields;
  v.innerHTML = `<div class="bar"><div class="grow small muted">These are the plant fields. New fields appear immediately for everyone in the add/edit form and on the plant page. You can also show them in the list, the QR code, and the Excel export.</div>
    <button class="btn pri" onclick="fieldModal()">${ICON.plus}Add new field</button></div>
  <div class="tablewrap"><table class="t"><thead><tr><th>Order</th><th>Label</th><th>Type</th><th>Group</th><th>In QR</th><th>In list</th><th>Required</th><th>Filled</th><th>Status</th><th></th></tr></thead><tbody>
  ${fs.map((f, i) => `<tr style="cursor:default"><td style="white-space:nowrap"><button class="btn sm" ${i ? "" : "disabled"} onclick="moveField(${i},-1)">↑</button> <button class="btn sm" ${i < fs.length - 1 ? "" : "disabled"} onclick="moveField(${i},1)">↓</button></td>
    <td><b>${esc(f.label)}</b>${f.label !== f.col ? `<div class="small muted mono">${esc(f.col)}</div>` : ""}</td><td>${TYPES[f.type] || esc(f.type)}</td><td>${esc(f.group)}</td>
    <td>${f.qr ? "✓" : ""}</td><td>${f.list ? "✓" : ""}</td><td>${f.req ? "✓" : ""}</td><td class="small">${plants().filter(p => String(p[f.col] == null ? "" : p[f.col]).trim()).length} / ${plants().length}</td>
    <td>${f.active ? '<span class="pill">Active</span>' : '<span class="pill h-Weak">Hidden</span>'}</td>
    <td style="white-space:nowrap"><button class="btn sm" onclick="fieldModal('${esc(f.col)}')">Edit</button> <button class="btn sm danger" onclick="deleteField('${esc(f.col)}')">Delete</button></td></tr>`).join("")}
  </tbody></table></div>
  <p class="small muted">Fixed fields (always present): Barcode, Location, size bands (${esc(S.bands.join(", "))} cm), Total Qty, Updated By, Updated At.</p>`;
}
function fieldModal(col) {
  const f = col ? S.fields.find(x => x.col === col) : {label: "", type: "text", group: "Master Data", options: [], qr: false, list: false, req: false, active: true};
  const groups = [...new Set(S.fields.map(x => x.group))];
  modal(col ? `Edit field · ${f.label}` : "Add new field", `<div class="form">
    <div><label>Label (shown in app)</label><input class="in" id="fl" value="${esc(f.label)}" placeholder="e.g. Supplier, Pot Size, Height"></div>
    <div><label>Type</label><select class="in" id="ft">${Object.entries(TYPES).map(([k, l]) => `<option value="${k}" ${f.type === k ? "selected" : ""}>${l}</option>`).join("")}</select></div>
    <div><label>Group / section</label><input class="in" id="fg" list="fgl" value="${esc(f.group)}"><datalist id="fgl">${groups.map(g => `<option value="${esc(g)}">`).join("")}</datalist></div>
    <div class="full" id="foWrap"><label>Dropdown options (one per line)</label><textarea class="in" id="fo" rows="4">${esc(f.options.join("\n"))}</textarea></div>
    <div class="full" style="display:flex;gap:18px;flex-wrap:wrap">
      <label style="display:flex;gap:6px;align-items:center;font-weight:500"><input type="checkbox" id="fq" ${f.qr ? "checked" : ""}> Show in QR code</label>
      <label style="display:flex;gap:6px;align-items:center;font-weight:500"><input type="checkbox" id="fli" ${f.list ? "checked" : ""}> Show as column in Plant Master list</label>
      <label style="display:flex;gap:6px;align-items:center;font-weight:500"><input type="checkbox" id="fr" ${f.req ? "checked" : ""}> Required</label>
      <label style="display:flex;gap:6px;align-items:center;font-weight:500"><input type="checkbox" id="fa" ${f.active ? "checked" : ""}> Active (untick to hide without deleting data)</label>
    </div>
    ${col ? `<div class="full small muted">Renaming the label keeps all existing data.</div>` : ""}
  </div>`, async () => {
    const label = $("#fl").value.trim(); if (!label) { toast("Label is required", true); return false; }
    const row = {label, type: $("#ft").value, grp: $("#fg").value.trim() || "Other", options: $("#fo").value.split("\n").map(s => s.trim()).filter(Boolean).join(";"),
      show_in_qr: $("#fq").checked, show_in_list: $("#fli").checked, required: $("#fr").checked, active: $("#fa").checked};
    if (col) { await rest(`fields?col=eq.${enc(col)}`, {method: "PATCH", body: row}); await logActivity("Edited field", label, `type ${row.type}, QR ${row.show_in_qr ? "yes" : "no"}, list ${row.show_in_list ? "yes" : "no"}, ${row.active ? "active" : "hidden"}`); }
    else {
      const key = label.replace(/[^\p{L}\p{N} ()\-\/.]/gu, "").trim();
      const taken = new Set(S.fields.map(x => x.col.toLowerCase()).concat(Object.values(FIXED).map(x => x.toLowerCase()), S.bands.map(b => (b + " cm").toLowerCase())));
      if (!key || taken.has(key.toLowerCase())) { toast(`A field named "${label}" already exists`, true); return false; }
      await rest("fields", {method: "POST", body: Object.assign({col: key, sort: Math.max(0, ...S.fields.map(x => x.order)) + 1}, row)});
      await logActivity("Added field", label, `New field (${TYPES[row.type]})`);
    }
    toast("Field saved"); await loadAll(true); render();
  });
  const sync = () => $("#foWrap").style.display = $("#ft").value === "select" ? "" : "none"; $("#ft").onchange = sync; sync();
}
async function moveField(i, d) {
  const list = S.fields.slice(), a = list[i]; if (!list[i + d]) return;
  list.splice(i, 1); list.splice(i + d, 0, a);
  try {
    const changed = list.map((f, k) => [f, k + 1]).filter(([f, k]) => f.order !== k);
    await Promise.all(changed.map(([f, k]) => rest(`fields?col=eq.${enc(f.col)}`, {method: "PATCH", body: {sort: k}})));
    await loadAll(true); render();
  } catch (e) { toast(e.message, true); }
}
async function deleteField(col) {
  const f = S.fields.find(x => x.col === col);
  const filled = plants().filter(p => String(p[col] == null ? "" : p[col]).trim()).length;
  if (!confirm(`Delete field "${f.label}"?\n\n${filled ? `⚠ ${filled} plants have a value in this field. These values will be permanently deleted.\n\nTip: use Edit → untick "Active" to hide it instead.` : "No plant has a value in this field."}`)) return;
  try {
    if (filled) await rest("rpc/remove_field_data", {method: "POST", body: {p_col: col}});
    await rest(`fields?col=eq.${enc(col)}`, {method: "DELETE"});
    await logActivity("Deleted field", f.label, `${filled} values removed`);
    toast("Field deleted"); await loadAll(true); render();
  } catch (e) { toast("Delete failed: " + e.message, true); }
}
/* =====================================================================
   ADMIN · USERS
   ===================================================================== */
function pUsers(v) {
  if (!can("users")) { v.innerHTML = `<div class="card empty">Super Admin only.</div>`; return; }
  setTitle("Users");
  const us = S.tables.Users.rows, pend = us.filter(u => u.role === "pending"), act = us.filter(u => u.role !== "pending");
  const url = S.settings["App URL"] || REDIRECT;
  v.innerHTML = `
  ${pend.length ? `<div class="card" style="margin-bottom:16px;border-color:#f3dcae;background:#fffaf0"><h3>Waiting for approval <small>${pend.length}</small></h3>
    <table class="t" style="background:transparent"><tbody>${pend.map(u => `<tr style="cursor:default"><td><b>${esc(u.Name)}</b><div class="small muted">${esc(u.Email)} · signed up ${esc(u.created)}</div></td>
    <td style="text-align:right;white-space:nowrap"><button class="btn sm pri" onclick="setRole('${u.id}','engineer')">Approve as Engineer</button> <button class="btn sm" onclick="setRole('${u.id}','manager')">as Manager</button> <button class="btn sm danger" onclick="removeUser('${u.id}')">Reject</button></td></tr>`).join("")}</tbody></table></div>` : ""}
  <div class="bar"><div class="grow small muted">To add a person: send them the app link <b class="mono">${esc(url)}</b>. They press <b>Create account</b>, then appear here for you to approve.</div>
    <button class="btn" onclick="navigator.clipboard.writeText('${esc(url)}').then(()=>toast('Link copied'))">Copy app link</button></div>
  <div class="tablewrap"><table class="t"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>
  ${act.map(u => `<tr style="cursor:default"><td><b>${esc(u.Name)}</b>${u.id === S.me.id ? ' <span class="small muted">(you)</span>' : ""}</td><td>${esc(u.Email)}</td><td>${esc(u.Role)}</td><td>${u.Active === "No" ? '<span class="pill h-Weak">Disabled</span>' : '<span class="pill">Active</span>'}</td>
  <td style="white-space:nowrap;text-align:right"><button class="btn sm" onclick="userModal('${u.id}')">Edit</button></td></tr>`).join("")}
  </tbody></table></div>
  <div class="card small" style="margin-top:16px"><h3>What each role can do</h3>
  <table class="t"><thead><tr><th>Action</th><th>Super Admin</th><th>Manager</th><th>Engineer</th></tr></thead><tbody>
  ${[["View dashboard, plants, reports, QR codes", 1, 1, 1], ["Add & edit plants, update stock quantities", 1, 1, 1], ["Add photo reports", 1, 1, 1], ["Delete plants & any report", 1, 1, 0], ["View activity log", 1, 1, 0], ["Add / change fields & columns", 1, 0, 0], ["Approve users, change roles, settings", 1, 0, 0]].map(r => `<tr style="cursor:default"><td>${r[0]}</td>${r.slice(1).map(x => `<td>${x ? "✓" : "—"}</td>`).join("")}</tr>`).join("")}
  </tbody></table><p class="muted" style="margin:10px 0 0">These rules are enforced by the database itself, not only by the app.</p></div>`;
}
async function setRole(id, role) {
  try { const u = S.tables.Users.rows.find(x => x.id === id); await rest(`profiles?id=eq.${id}`, {method: "PATCH", body: {role, active: true}}); await logActivity("Approved user", u.Email, ROLES[role]); toast(`${u.Name} approved as ${ROLES[role]}`); await loadAll(true); render(); }
  catch (e) { toast(e.message, true); }
}
function userModal(id) {
  const u = S.tables.Users.rows.find(x => x.id === id);
  modal("Edit user", `<div class="form">
    <div class="full"><label>Email</label><input class="in" value="${esc(u.Email)}" disabled></div>
    <div><label>Name</label><input class="in" id="un" value="${esc(u.Name)}"></div>
    <div><label>Role</label><select class="in" id="ur">${Object.entries(ROLES).map(([k, r]) => `<option value="${k}" ${u.role === k ? "selected" : ""}>${r}</option>`).join("")}</select></div>
    <div><label>Status</label><select class="in" id="ua"><option value="true">Active</option><option value="false" ${u.Active === "No" ? "selected" : ""}>Disabled (cannot sign in to the app)</option></select></div></div>`, async () => {
    const row = {name: $("#un").value.trim() || u.Email, role: $("#ur").value, active: $("#ua").value === "true"};
    await rest(`profiles?id=eq.${id}`, {method: "PATCH", body: row});
    await logActivity("Edited user", u.Email, `${ROLES[row.role]}, ${row.active ? "active" : "disabled"}`);
    toast("User saved"); await loadAll(true); render();
  });
}
async function removeUser(id) {
  const u = S.tables.Users.rows.find(x => x.id === id);
  if (!confirm(`Reject ${u.Email}? They won't be able to use the app.`)) return;
  try { await rest(`profiles?id=eq.${id}`, {method: "PATCH", body: {active: false}}); await logActivity("Rejected user", u.Email, ""); await loadAll(true); render(); toast("User rejected"); }
  catch (e) { toast(e.message, true); }
}
/* =====================================================================
   ADMIN · ACTIVITY + SETTINGS
   ===================================================================== */
function pActivity(v) {
  if (!can("activity")) { v.innerHTML = `<div class="card empty">No access.</div>`; return; }
  setTitle("Activity Log");
  const all = (S.tables.Activity || {rows: []}).rows.slice().reverse();
  v.innerHTML = `<div class="bar"><div class="search">${ICON.search}<input class="in" id="aq" placeholder="Search user, barcode, action…"></div><button class="btn" onclick="refreshNow()">Refresh</button></div><div id="alist"></div>`;
  const draw = q => { const l = all.filter(a => !q || Object.values(a).join(" ").toLowerCase().includes(q.toLowerCase())).slice(0, 500);
    $("#alist").innerHTML = `<div class="tablewrap"><table class="t"><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Target</th><th>Details</th></tr></thead><tbody>${l.map(a => `<tr style="cursor:default"><td class="small" style="white-space:nowrap">${esc(excelDate(a.Time))}</td><td>${esc(a.User)}</td><td>${esc(a.Action)}</td><td class="mono">${/^[A-Z]{3,5}-/.test(a.Target) ? `<a href="#/plant/${encodeURIComponent(a.Target)}">${esc(a.Target)}</a>` : esc(a.Target)}</td><td class="small">${esc(a.Details)}</td></tr>`).join("")}</tbody></table></div>`; };
  $("#aq").oninput = e => draw(e.target.value); draw("");
}
function pSettings(v) {
  if (!can("settings")) { v.innerHTML = `<div class="card empty">Super Admin only.</div>`; return; }
  setTitle("Settings");
  const s = S.settings;
  v.innerHTML = `<div class="card" style="max-width:820px"><div class="form">
    <div class="full"><label>Company name</label><input class="in" id="sCo" value="${esc(s["Company Name"] || "EFALP Nurseries")}"></div>
    <div class="full"><label>Nursery locations (one per line: CODE = Name)</label><textarea class="in mono" id="sLoc" rows="3">${esc(S.locations.map(l => `${l.code} = ${l.name}`).join("\n"))}</textarea>
      <div class="small muted">The code is the first part of each barcode (e.g. ALRH-COCA-0001).</div></div>
    <div class="full"><label>Plant health options (one per line)</label><textarea class="in" id="sH" rows="4">${esc(S.health.join("\n"))}</textarea></div>
    <div><label>QR code content</label><select class="in" id="sQr"><option value="details">Plant details as text (works offline)</option><option value="link" ${/link/i.test(s["QR Content"]) ? "selected" : ""}>Link that opens the plant in this app</option></select></div>
    <div><label>App web address</label><input class="in" id="sUrl" value="${esc(s["App URL"] || REDIRECT)}"></div>
    <div class="full small muted">Size bands: ${esc(S.bands.join(", "))} cm.</div>
  </div><div class="bar" style="justify-content:flex-end;margin:14px 0 0"><button class="btn pri" id="sSave">Save settings</button></div></div>
  <div class="card small" style="max-width:820px;margin-top:16px"><h3>Backup</h3>
    <p>Data is stored in your Supabase database. Download a copy now and then and keep it on your company OneDrive:</p>
    <div class="bar" style="margin:0"><button class="btn" onclick="exportCSV(plants())">${ICON.xl}Plants (Excel / CSV)</button><button class="btn" onclick="downloadBackup()">${ICON.dl}Full backup (all data)</button>
      <label class="btn" style="margin:0;font-size:14px;color:var(--ink)">${ICON.plus}Import data file<input type="file" accept=".json,application/json" hidden onchange="importData(this.files[0])"></label><span id="impMsg" class="small muted"></span></div>
    <p class="muted">Supabase free plan: the project pauses after 7 days with no use at all. Open the app at least once a week, or restore it from the Supabase dashboard with one click.</p></div>`;
  $("#sSave").onclick = async () => {
    const vals = {"Company Name": $("#sCo").value.trim(), "Locations": $("#sLoc").value.split("\n").map(l => l.split("=").map(x => x.trim())).filter(x => x[0]).map(x => `${x[0].toUpperCase()}=${x[1] || x[0]}`).join(";"),
      "Health Options": $("#sH").value.split("\n").map(x => x.trim()).filter(Boolean).join(";"), "QR Content": $("#sQr").value, "App URL": $("#sUrl").value.trim()};
    const b = $("#sSave"); b.disabled = true; b.textContent = "Saving…";
    try {
      const rows = Object.entries(vals).filter(([k, val]) => String(S.settings[k] == null ? "" : S.settings[k]) !== val).map(([key, value]) => ({key, value}));
      if (rows.length) await rest("settings?on_conflict=key", {method: "POST", body: rows, headers: {Prefer: "resolution=merge-duplicates"}});
      await logActivity("Settings", "Settings", rows.map(r => r.key).join(", ") || "No changes"); await loadAll(true); toast("Settings saved"); render();
    } catch (e) { toast(e.message, true); b.disabled = false; b.textContent = "Save settings"; }
  };
}
start();
</script>
</body>
